name: daily-update
on:
  schedule:
    - cron: "15 14 * * 1-5"   # 19:45 IST, Monday-Friday (after NSE publishes the bhavcopy)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-pipeline.txt
      - run: python daily_update.py
      - name: commit new data
        run: |
          git config user.name "neuravol-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/surfaces data/forecasts data/latest_chain.csv
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
